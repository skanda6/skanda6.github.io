<script>
// Add availability toggle UI for each menu item. Default = Unavailable (unchecked).
function addAvailabilityToggles() {
  var menuInputs = document.querySelectorAll('input.staticrypt-check[type="checkbox"]');
  menuInputs.forEach(function(input){
    // Skip hidden or inputs with no value
    if (!input.value) return;

    // Find the label element (could be next sibling)
    var label = input.nextElementSibling;

    // Create wrapper span to contain toggle and status
    var wrapper = document.createElement('span');
    wrapper.style.marginLeft = '10px';

    var toggle = document.createElement('input');
    toggle.type = 'checkbox';
    toggle.className = 'availability-toggle';
    toggle.name = 'availability[]';
    toggle.value = input.value; // same value string as the menu item
    toggle.title = 'Check to mark Available (default Unavailable)';

    var status = document.createElement('span');
    status.className = 'availability-label';
    status.textContent = ' (Unavailable)';

    // When toggled, update the status text
    toggle.addEventListener('change', function(){
      status.textContent = this.checked ? ' (Available)' : ' (Unavailable)';
    });

    // Append toggle and status to wrapper
    wrapper.appendChild(toggle);
    wrapper.appendChild(status);

    // Insert wrapper after the label if possible, else after the input
    if (label && label.parentNode) {
      if (label.nextSibling) label.parentNode.insertBefore(wrapper, label.nextSibling);
      else label.parentNode.appendChild(wrapper);
    } else {
      input.parentNode.appendChild(wrapper);
    }
  });
}

// Run after the window loads so DOM is ready and other onload functions run first
window.addEventListener('load', function() {
  try { addAvailabilityToggles(); } catch (e) { console.error('Availability toggles init error', e); }
});
</script>
