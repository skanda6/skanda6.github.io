<!doctype html>
<html class="staticrypt-html">
<head>
    <meta charset="utf-8">
    <title>MTNA Temple - Cafeteria Menu Maintenance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="cache-control" content="max-age=0"/>
    <meta http-equiv="cache-control" content="no-cache"/>
    <meta http-equiv="expires" content="0"/>
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT"/>
    <meta http-equiv="pragma" content="no-cache"/>
    <meta HTTP-equiv="refresh" content="900; URL=maintenance.html" />

    <style>
        .staticrypt-hr { margin-top: 20px; margin-bottom: 20px; border: 0; border-top: 1px solid #eee; }
        .staticrypt-page { width: 90%; max-width: 900px; padding: 2% 0; margin: auto; box-sizing: border-box; }
        .staticrypt-form { position: relative; z-index: 1; background: #FFFFFF; margin: 0 auto 50px; padding: 20px; text-align: left; box-shadow: 0 0 10px rgba(0,0,0,0.12); }
        .staticrypt-check { outline: 0; background: #f2f2f2; width: 180px; border: 0; margin: 0 0 10px; padding: 6px; box-sizing: border-box; font-size: 14px; }
        .staticrypt-form .staticrypt-decrypt-button { text-transform: uppercase; outline: 0; background: #4CAF50; border: 0; padding: 10px 14px; color: #FFFFFF; font-size: 14px; cursor: pointer; }
        .staticrypt-body { margin-bottom: 1em; background: linear-gradient(to left, #76b852, #8DC26F); font-family: "Arial", sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: g[...]
        .menu-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0; border-bottom: 1px solid #f0f0f0; }
        .menu-item { flex:1; }
        .menu-controls { width:200px; text-align:right; }
        h2 { margin-top:18px; }
        label.item-label { font-weight:500; }

        /* Toggle switch styles */
        .switch { position: relative; display: inline-block; width: 52px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #4CAF50; }
        input:checked + .slider:before { transform: translateX(24px); }
        .toggle-text { display: inline-block; width: 44px; text-align: center; font-size: 12px; margin-left: 8px; vertical-align: middle; }
    </style>
</head>
<body class="staticrypt-body">
    <div class="staticrypt-page">
        <div class="staticrypt-form">
            <div class="staticrypt-instructions">
                <p class="staticrypt-title">MTNA - Cafeteria Menu Maintenance</p>
            </div>

            <hr class="staticrypt-hr">

            <form id="menu-form" onsubmit="return false;">
                <div id="menu-container"></div>

                <input type="hidden" id="shaInput" name="shaInput" value="initial" />
                <input type="hidden" id="pootuInput" name="pootuInput" value="initial" />

                <div style="margin-top:12px;">
                    <label for="password">Password</label>
                    <input id="staticrypt-password" type="password" name="password" placeholder="Password" autofocus />
                </div>

                <div style="margin-top:12px;">
                    <input type="submit" class="staticrypt-decrypt-button" name="Submit" value="Submit" />
                </div>
            </form>
        </div>
    </div>

<footer class="staticrypt-footer"></footer>

<script>
// Menu data (keeps the original item strings so backend can parse them if needed)
const menu = [
  { section: 'Appetizer', items: [
    'Appetizer:Aloo Bonda:$6', 'Appetizer:Banana Rava Fry (4pcs):$5', 'Appetizer:Onion Pakoda:$5', 'Appetizer:Tomato Soup:$5', 'Appetizer:Medu Vadai(2 pieces):$5', 'Appetizer:Paruppu Vadai:$5', 'Appet[...]
  ]},
  { section: 'Desserts', items: [
    'Appetizer:Ashoka Halwa:$5', 'Appetizer:Carrot Halwa:$5', 'Appetizer:Chocolate Kesari:$4', 'Appetizer:Mango Kesari:$4', 'Appetizer:Plain Kesari:$4', 'Appetizer:Pineapple Kesari:$4', 'Appetizer:Sna[...]
  ]},
  { section: 'Dish Items', items: [
    'Dish:Breakfast Combo:$9', 'Dish:Idiyappam:$6', 'Dish:Idly:$5', 'Dish:Chapati(2 Pieces):$5', 'Dish:Dal Kichadi:$6', 'Dish:Garlic Naan & Paneer Butter:$8', 'Dish:Garlic Naan & Palak Paneer:$8', 'Di[...]
  ]},
  { section: 'Rice Dish Items', items: [
    'RiceDish:Bagalabath:$5', 'RiceDish:Coconut Rice:$4', 'RiceDish:Corrainder Rice:$5', 'RiceDish:Combo Meal:$13', 'RiceDish:Jeera Rice & Palak Paneer:$8', 'RiceDish:Jeera Rice Dal:$7', 'RiceDish:Ghe[...]
  ]},
  { section: 'Extra Items', items: [
    'Dosa/Idly batter 32oz:$5', 'Extra:Kurma(8oz/16oz/32oz):$3/$5/$10', 'Extra:Masala(8oz/16oz/32oz):$3/$5/$10', 'Extra:Sambar(8oz/16oz/32oz):$2/$4/$8'
  ]},
  { section: 'Drinks', items: [
    'Drinks:Coffee:$2', 'Drinks:Hot Horlicks:$3', 'Drinks:Masala Tea:$2', 'Drinks:Mango Lassi:$3', 'Drinks:Masala Buttermilk:$2', 'Drinks:Plum Lemonade:$3', 'Drinks:Rose Milk:$3', 'Drinks:Water:$1'
  ]}
];

function nameForSection(section) {
  if (section === 'Rice Dish Items') return 'riceDish[]';
  if (section === 'Dish Items') return 'dish[]';
  if (section === 'Extra Items') return 'extra[]';
  if (section === 'Drinks') return 'drinks[]';
  if (section === 'Appetizer') return 'appetizer[]';
  if (section === 'Desserts') return 'desserts[]';
  return 'items[]';
}

function buildMenu() {
  const container = document.getElementById('menu-container');
  menu.forEach(section => {
    const h = document.createElement('h2');
    h.textContent = section.section;
    container.appendChild(h);

    section.items.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'menu-row';

      const parts = item.split(':');
      // label text: use last two parts for name and price when possible
      let labelText = item;
      if (parts.length >= 2) {
        labelText = parts.slice(1).join(':');
      }

      const itemDiv = document.createElement('div');
      itemDiv.className = 'menu-item';
      const label = document.createElement('label');
      label.className = 'item-label';
      label.textContent = labelText.replace(/\$.*$/, '').trim();
      itemDiv.appendChild(label);
      row.appendChild(itemDiv);

      const controls = document.createElement('div');
      controls.className = 'menu-controls';

      // create an On/Off toggle representing Available / Unavailable
      const toggleWrapper = document.createElement('span');
      const toggleLabel = document.createElement('label');
      toggleLabel.className = 'switch';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'staticrypt-toggle';
      checkbox.checked = true; // default to On (Available)
      checkbox.setAttribute('data-item', item);
      checkbox.setAttribute('data-name', nameForSection(section.section));
      checkbox.setAttribute('aria-label', label.textContent + ' availability');

      const slider = document.createElement('span');
      slider.className = 'slider';

      toggleLabel.appendChild(checkbox);
      toggleLabel.appendChild(slider);

      const toggleText = document.createElement('span');
      toggleText.className = 'toggle-text';
      toggleText.textContent = checkbox.checked ? 'On' : 'Off';

      // update toggle text on change
      checkbox.addEventListener('change', function () {
        toggleText.textContent = this.checked ? 'On' : 'Off';
      });

      toggleWrapper.appendChild(toggleLabel);
      toggleWrapper.appendChild(toggleText);
      controls.appendChild(toggleWrapper);
      row.appendChild(controls);

      container.appendChild(row);
    });
  });
}

// Build menu on load
document.addEventListener('DOMContentLoaded', buildMenu);

// Submit handler: collects toggle states and logs them (adapt to your save flow)
document.getElementById('menu-form').addEventListener('submit', function (e) {
  e.preventDefault();
  const data = {};
  const toggles = document.querySelectorAll('.staticrypt-toggle');
  toggles.forEach(t => {
    const name = t.getAttribute('data-name') || 'items[]';
    const item = t.getAttribute('data-item');
    if (!data[name]) data[name] = [];
    const val = (t.checked ? 'Available:' : 'Unavailable:') + item;
    data[name].push(val);
  });
  console.log('Collected menu availability:', data);
  alert('Menu availability collected (see console).');
});
</script>
</body>
</html>
