<script>
    // Enhanced listener: ensures every checkbox has a status indicator and toggles it when changed.
    function initMenuListeners() {
        const checkboxes = document.querySelectorAll('.staticrypt-check');

        checkboxes.forEach(box => {
            // Find a label for the checkbox
            const id = box.id;
            let label = null;
            if (id) label = document.querySelector('label[for="' + id + '"]');

            // If no label found, try neighboring nodes
            if (!label) {
                if (box.nextElementSibling && box.nextElementSibling.tagName.toLowerCase() === 'label') {
                    label = box.nextElementSibling;
                } else if (box.parentNode) {
                    // search inside parent for a label
                    label = box.parentNode.querySelector('label');
                }
            }

            // Create or find a status indicator element
            let indicator = null;
            if (label) {
                // see if label has a following status-indicator
                const possible = label.nextElementSibling;
                if (possible && possible.classList && possible.classList.contains('status-indicator')) {
                    indicator = possible;
                }
            }

            if (!indicator) {
                indicator = document.createElement('span');
                indicator.className = 'status-indicator status-unavailable';
                indicator.textContent = '(Unavailable)';
                // insert after label if possible, otherwise after the checkbox
                if (label && label.parentNode) label.parentNode.insertBefore(indicator, label.nextSibling);
                else if (box.parentNode) box.parentNode.appendChild(indicator);
            }

            // Set initial state
            const setState = (checked) => {
                if (checked) {
                    indicator.textContent = '(Available)';
                    indicator.className = 'status-indicator status-available';
                } else {
                    indicator.textContent = '(Unavailable)';
                    indicator.className = 'status-indicator status-unavailable';
                }
            };

            setState(box.checked);

            // Listen for changes
            box.addEventListener('change', function () {
                setState(this.checked);
            });
        });

        // Wire global controls
        const markAllAvailableBtn = document.getElementById('markAllAvailable');
        const markAllUnavailableBtn = document.getElementById('markAllUnavailable');

        if (markAllAvailableBtn) markAllAvailableBtn.addEventListener('click', markAllAvailable);
        if (markAllUnavailableBtn) markAllUnavailableBtn.addEventListener('click', markAllUnavailable);
    }

    function markAllAvailable() {
        const checkboxes = document.querySelectorAll('.staticrypt-check');
        checkboxes.forEach(box => {
            box.checked = true;
            box.dispatchEvent(new Event('change'));
        });
    }

    function markAllUnavailable() {
        const checkboxes = document.querySelectorAll('.staticrypt-check');
        checkboxes.forEach(box => {
            box.checked = false;
            box.dispatchEvent(new Event('change'));
        });
    }

    // Call initMenuListeners on DOMContentLoaded
    document.addEventListener('DOMContentLoaded', function () {
        if (typeof initMenuListeners === 'function') initMenuListeners();
    });
</script>
