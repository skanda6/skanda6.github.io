<!doctype html>
<html class="staticrypt-html">
<head>
    <meta charset="utf-8">
    <title>MTNA Temple - Cafeteria Menu Maintenance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="cache-control" content="max-age=0"/>
    <meta http-equiv="cache-control" content="no-cache"/>
    <meta http-equiv="expires" content="0"/>
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT"/>
    <meta http-equiv="pragma" content="no-cache"/>
    <meta HTTP-equiv="refresh" content="900; URL=maintenance.html" />

    <style>
        .staticrypt-hr { margin-top: 20px; margin-bottom: 20px; border: 0; border-top: 1px solid #eee; }
        .staticrypt-page { width: 90%; max-width: 900px; padding: 2% 0; margin: auto; box-sizing: border-box; }
        .staticrypt-form { position: relative; z-index: 1; background: #FFFFFF; margin: 0 auto 50px; padding: 20px; text-align: left; box-shadow: 0 0 10px rgba(0,0,0,0.12); }
        .staticrypt-check { outline: 0; background: #f2f2f2; width: 180px; border: 0; margin: 0 0 10px; padding: 6px; box-sizing: border-box; font-size: 14px; }
        .staticrypt-form .staticrypt-decrypt-button { text-transform: uppercase; outline: 0; background: #4CAF50; border: 0; padding: 10px 14px; color: #FFFFFF; font-size: 14px; cursor: pointer; }
        .staticrypt-body { margin-bottom: 1em; background: linear-gradient(to left, #76b852, #8DC26F); font-family: "Arial", sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .menu-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0; border-bottom: 1px solid #f0f0f0; }
        .menu-item { flex:1; }
        .menu-controls { width:200px; text-align:right; }
        h2 { margin-top:18px; }
        label.item-label { font-weight:500; }
    </style>
</head>
<body class="staticrypt-body">
    <div class="staticrypt-page">
        <div class="staticrypt-form">
            <div class="staticrypt-instructions">
                <p class="staticrypt-title">MTNA - Cafeteria Menu Maintenance</p>
            </div>

            <hr class="staticrypt-hr">

            <form id="menu-form" onsubmit="return false;">
                <div id="menu-container"></div>

                <input type="hidden" id="shaInput" name="shaInput" value="initial" />
                <input type="hidden" id="pootuInput" name="pootuInput" value="initial" />

                <div style="margin-top:12px;">
                    <label for="password">Password</label>
                    <input id="staticrypt-password" type="password" name="password" placeholder="Password" autofocus />
                </div>

                <div style="margin-top:12px;">
                    <input type="submit" class="staticrypt-decrypt-button" name="Submit" value="Submit" />
                </div>
            </form>
        </div>
    </div>

<footer class="staticrypt-footer"></footer>

<script>
// Menu data (keeps the original item strings so backend can parse them if needed)
const menu = [
  { section: 'Appetizer', items: [
    'Appetizer:Aloo Bonda:$6', 'Appetizer:Banana Rava Fry (4pcs):$5', 'Appetizer:Onion Pakoda:$5', 'Appetizer:Tomato Soup:$5', 'Appetizer:Medu Vadai(2 pieces):$5', 'Appetizer:Paruppu Vadai:$5', 'Appetizer:Plantain Bajji(4 Pieces):$5', 'Appetizer:Sambar Vadai:$6', 'Appetizer:Thayir Vadai:$6', 'Appetizer:Chilli BHajji:$5'
  ]},
  { section: 'Desserts', items: [
    'Appetizer:Ashoka Halwa:$5', 'Appetizer:Carrot Halwa:$5', 'Appetizer:Chocolate Kesari:$4', 'Appetizer:Mango Kesari:$4', 'Appetizer:Plain Kesari:$4', 'Appetizer:Pineapple Kesari:$4', 'Appetizer:Snacks:$5', 'Appetizer:Sweets:$6', 'Appetizer:Samosa (2 Piece):$5', 'Appetizer:Breakfast Combo:$9', 'appetizer:Milk Mysorepak:$6'
  ]},
  { section: 'Dish Items', items: [
    'Dish:Breakfast Combo:$9', 'Dish:Idiyappam:$6', 'Dish:Idly:$5', 'Dish:Chapati(2 Pieces):$5', 'Dish:Dal Kichadi:$6', 'Dish:Garlic Naan & Paneer Butter:$8', 'Dish:Garlic Naan & Palak Paneer:$8', 'Dish:Garlic Naan & Dal Makhni:$8', 'Dish:Kichadi Upma:$5', 'Dish:Millet Kitchadi:$6', 'Dish:Millet Pongal:$6', 'Dish:Masala Dosai:$7', 'Dish:Mysore Masala Dosai:$9'
  ]},
  { section: 'Rice Dish Items', items: [
    'RiceDish:Bagalabath:$5', 'RiceDish:Coconut Rice:$4', 'RiceDish:Corrainder Rice:$5', 'RiceDish:Combo Meal:$13', 'RiceDish:Jeera Rice & Palak Paneer:$8', 'RiceDish:Jeera Rice Dal:$7', 'RiceDish:Ghee Rice with Kurma:$8', 'RiceDish:Lemon Rice:$4', 'RiceDish:Lemon Rice With Fried Chilli:$5', 'RiceDish:Lunch Special Meals:$15', 'RiceDish:Mint Rice:$5', 'RiceDish:Sambar Rice:$6', 'RiceDish:Special Meal:$12', 'RiceDish:Tomato Rice:$5', 'RiceDish:Variety Rice:$5', 'RiceDish:Vangibath:$5', 'RiceDish:Veg.Pulav:$6', 'RiceDish:Yogurt Rice:$4'
  ]},
  { section: 'Extra Items', items: [
    'Dosa/Idly batter 32oz:$5', 'Extra:Kurma(8oz/16oz/32oz):$3/$5/$10', 'Extra:Masala(8oz/16oz/32oz):$3/$5/$10', 'Extra:Sambar(8oz/16oz/32oz):$2/$4/$8'
  ]},
  { section: 'Drinks', items: [
    'Drinks:Coffee:$2', 'Drinks:Hot Horlicks:$3', 'Drinks:Masala Tea:$2', 'Drinks:Mango Lassi:$3', 'Drinks:Masala Buttermilk:$2', 'Drinks:Plum Lemonade:$3', 'Drinks:Rose Milk:$3', 'Drinks:Water:$1'
  ]}
];

function buildMenu() {
  const container = document.getElementById('menu-container');
  menu.forEach(section => {
    const h = document.createElement('h2');
    h.textContent = section.section;
    container.appendChild(h);

    section.items.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'menu-row';

      const parts = item.split(':');
      // label text: use last two parts for name and price when possible
      let labelText = item;
      if (parts.length >= 2) {
        labelText = parts.slice(1).join(':');
      }

      const itemDiv = document.createElement('div');
      itemDiv.className = 'menu-item';
      const label = document.createElement('label');
      label.className = 'item-label';
      label.textContent = labelText.replace(/\$.*$/, '').trim();
      itemDiv.appendChild(label);
      row.appendChild(itemDiv);

      const controls = document.createElement('div');
      controls.className = 'menu-controls';

      // create a select representing Available / Unavailable
      const select = document.createElement('select');
      select.className = 'staticrypt-check';
      select.name = (section.section === 'Rice Dish Items') ? 'riceDish[]' : section.section === 'Dish Items' ? 'dish[]' : section.section === 'Extra Items' ? 'extra[]' : section.section === 'Drinks' ? 'drinks[]' : 'appetizer[]';

      // value options include availability + original item string so backend can parse
      const optAv = document.createElement('option');
      optAv.value = 'Available:' + item;
      optAv.text = 'Available';
      const optUn = document.createElement('option');
      optUn.value = 'Unavailable:' + item;
      optUn.text = 'Unavailable';

      select.appendChild(optAv);
      select.appendChild(optUn);

      controls.appendChild(select);
      row.appendChild(controls);

      container.appendChild(row);
    });
  });
}

// Build menu on load
document.addEventListener('DOMContentLoaded', buildMenu);

// Example submit handler: collects selections and logs them (you can adapt to your save flow)
document.getElementById('menu-form').addEventListener('submit', function (e) {
  e.preventDefault();
  const data = {};
  const selects = document.querySelectorAll('.staticrypt-check');
  selects.forEach(s => {
    if (!data[s.name]) data[s.name] = [];
    data[s.name].push(s.value);
  });
  console.log('Collected menu availability:', data);
  alert('Menu availability collected (see console).');
});
</script>
    <script> document.addEventListener('DOMContentLoaded', function () { // Gather checked values and save, then redirect. function saveSelectionsAndRedirect(e) { if (e && typeof e.preventDefault === 'function') e.preventDefault(); // Collect checked checkboxes values (works even with duplicated ids) var checked = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')) .map(function (el) { return el.value; }); try { localStorage.setItem('mtna_cafe_selections', JSON.stringify(checked)); } catch (err) { console.error('Unable to write to localStorage', err); } // Optional: update hidden inputs if other code expects them var shaInput = document.getElementById('shaInput'); var pootuInput = document.getElementById('pootuInput'); if (shaInput) shaInput.value = 'saved-from-maintenance-' + Date.now(); if (pootuInput) pootuInput.value = checked.join(';'); // Redirect to cafe.html (site root path) window.location.href = 'cafe.html'; } // Bind to submit button click (works even if the <form> is malformed) var submitBtn = document.querySelector('input[type="submit"], button[type="submit"]'); if (submitBtn) submitBtn.addEventListener('click', saveSelectionsAndRedirect); // Also catch any form submit event (fallback) document.addEventListener('submit', function (ev) { saveSelectionsAndRedirect(ev); }, true); }); </script>
</body>
</html>
