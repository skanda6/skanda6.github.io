<!-- Small UI script to convert checkboxes into Available / Unavailable toggles -->
<script>
(function(){
    function transformToggles(){
        var inputs = Array.prototype.slice.call(document.querySelectorAll('input.staticrypt-check'));
        inputs.forEach(function(input, index){
            try{
                var baseName = (input.name || 'item').replace(/\[\]/g, '').replace(/[^a-zA-Z0-9_\-]/g,'') || 'item';
                // keep existing id
                // Find associated label (the textual item name). We prefer the next sibling label
                var textLabel = null;
                if(input.nextElementSibling && input.nextElementSibling.tagName.toLowerCase() === 'label'){
                    textLabel = input.nextElementSibling;
                } else {
                    textLabel = document.querySelector('label[for="' + input.id + '"]');
                }

                if(!textLabel){
                    textLabel = document.createElement('label');
                    textLabel.textContent = input.value || 'Item';
                }

                var container = document.createElement('div');
                container.className = 'item-row';

                var nameLabel = document.createElement('label');
                nameLabel.className = 'item-name';
                nameLabel.textContent = textLabel.textContent.trim();

                var switchLabel = document.createElement('label');
                switchLabel.className = 'switch';

                if(input.parentNode){ input.parentNode.removeChild(input); }
                switchLabel.appendChild(input);

                var slider = document.createElement('span');
                slider.className = 'slider';
                switchLabel.appendChild(slider);

                var status = document.createElement('span');
                status.className = 'status';
                status.textContent = input.checked ? 'Available' : 'Unavailable';

                input.addEventListener('change', function(){
                    status.textContent = input.checked ? 'Available' : 'Unavailable';
                });

                container.appendChild(nameLabel);
                container.appendChild(switchLabel);
                container.appendChild(status);

                if(textLabel.parentNode){
                    textLabel.parentNode.insertBefore(container, textLabel);
                    textLabel.parentNode.removeChild(textLabel);
                } else {
                    document.querySelector('.staticrypt-form').appendChild(container);
                }
            } catch(e){
                console.error('toggle transform error', e);
            }
        });
    }

    if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', transformToggles);
    } else {
        transformToggles();
    }
})();
</script>

<!-- Submit handler: save locally AND POST to Netlify Forms via fetch -->
<script>
document.addEventListener('DOMContentLoaded', function(){
    var form = document.getElementById('staticrypt-form');
    var banner = document.getElementById('saveBanner');

    function showBanner(message, isSuccess){
        if(!banner) return;
        banner.textContent = message;
        banner.className = 'save-banner ' + (isSuccess ? 'success' : 'error');
        banner.style.display = 'block';
        clearTimeout(banner._hideTimer);
        banner._hideTimer = setTimeout(function(){ banner.style.display = 'none'; }, 3000);
    }

    if(!form) return;

    form.addEventListener('submit', function(e){
        e.preventDefault(); // keep user on page

        // Save locally first
        var checked = Array.prototype.slice.call(document.querySelectorAll('input.staticrypt-check'))
            .filter(function(i){ return i.checked; });

        var payload = { items: {}, password: '' };
        checked.forEach(function(i){
            var name = (i.name || '').replace(/\[\]$/,'');
            if(!payload.items[name]) payload.items[name] = [];
            payload.items[name].push(i.value);
        });
        var pw = document.getElementById('staticrypt-password');
        if(pw) payload.password = pw.value;

        try{
            localStorage.setItem('menuMaintenanceDraft', JSON.stringify({ ts: Date.now(), payload: payload }));
        }catch(err){
            console.warn('Could not save locally', err);
        }

        // Now submit to Netlify via fetch using FormData
        try{
            var formData = new FormData(form);
            // ensure form-name is present
            if(!formData.get('form-name')) formData.append('form-name', form.getAttribute('name') || 'menu-maintenance');

            fetch(window.location.pathname, {
                method: 'POST',
                body: formData
            }).then(function(response){
                if(response.ok){
                    showBanner('Saved locally and submitted to Netlify.', true);
                    // optionally clear local draft after successful remote submit
                    // localStorage.removeItem('menuMaintenanceDraft');
                } else {
                    showBanner('Saved locally but remote submission failed (status ' + response.status + ').', false);
                }
            }).catch(function(err){
                console.error('Netlify submit failed', err);
                showBanner('Saved locally but remote submission failed (network error).', false);
            });
        }catch(e){
            console.error('Submission error', e);
            showBanner('Saved locally but submission failed.', false);
        }
    });

    // Restore previous selections if present
    try{
        var saved = localStorage.getItem('menuMaintenanceDraft');
        if(saved){
            var obj = JSON.parse(saved).payload;
            if(obj && obj.items){
                Object.keys(obj.items).forEach(function(name){
                    obj.items[name].forEach(function(val){
                        var selector = 'input.staticrypt-check[name="' + name + '[]"][value="' + val.replace(/"/g,'\"') + '"]';
                        var el = document.querySelector(selector);
                        if(el) el.checked = true;
                    });
                });
            }
            if(obj && obj.password){
                var pw2 = document.getElementById('staticrypt-password');
                if(pw2) pw2.value = obj.password;
            }
        }
    }catch(e){
        console.warn('Could not restore draft', e);
    }
});
</script>
