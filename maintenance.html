        .switch { position:relative; display:inline-block; width:54px; height:28px; vertical-align: middle; }
        .switch input { display:none; }
        .slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#ccc; transition:.4s; border-radius:34px; }
        .slider:before { position:absolute; content:""; height:22px; width:22px; left:3px; bottom:3px; background:white; transition:.4s; border-radius:50%; }
        .switch input:checked + .slider { background:#4CAF50; }
        .switch input:checked + .slider:before { transform: translateX(26px); }
        .status { margin-left:10px; min-width:90px; text-align:left; font-weight:600; }

<!-- Small UI script to convert checkboxes into Available / Unavailable toggles -->
<script>
(function(){
    // Run after a small delay to let any other scripts initialize
    function transformToggles(){
        var inputs = Array.prototype.slice.call(document.querySelectorAll('input.staticrypt-check'));
        inputs.forEach(function(input, index){
            try{
                // Give each input a unique id (preserve name for form submission)
                var baseName = (input.name || 'item').replace(/\[\]/g, '').replace(/[^a-zA-Z0-9_\-]/g,'') || 'item';
                input.id = baseName + '_avail_' + index;

                // Find associated label (the textual item name). We prefer the next sibling label
                var textLabel = null;
                if(input.nextElementSibling && input.nextElementSibling.tagName.toLowerCase() === 'label'){
                    textLabel = input.nextElementSibling;
                } else {
                    // try to find by for attribute (may fail if duplicate ids existed earlier)
                    textLabel = document.querySelector('label[for="' + input.id + '"]');
                }

                // If no label found, create a fallback
                if(!textLabel){
                    textLabel = document.createElement('label');
                    textLabel.textContent = input.value || 'Item';
                }

                // Create container for the row
                var container = document.createElement('div');
                container.className = 'item-row';

                // Create a label for the item name
                var nameLabel = document.createElement('label');
                nameLabel.className = 'item-name';
                nameLabel.textContent = textLabel.textContent.trim();

                // Build the switch structure (put the input inside)
                var switchLabel = document.createElement('label');
                switchLabel.className = 'switch';

                // Move the existing input into the switchLabel
                // remove input from original position
                if(input.parentNode){ input.parentNode.removeChild(input); }
                switchLabel.appendChild(input);

                // Create slider span
                var slider = document.createElement('span');
                slider.className = 'slider';
                switchLabel.appendChild(slider);

                // Create status element
                var status = document.createElement('span');
                status.className = 'status';
                status.textContent = input.checked ? 'Available' : 'Unavailable';

                // Update status on change
                input.addEventListener('change', function(){
                    status.textContent = input.checked ? 'Available' : 'Unavailable';
                });

                // Put elements into container
                container.appendChild(nameLabel);
                container.appendChild(switchLabel);
                container.appendChild(status);

                // Insert container into the DOM where the original label was
                if(textLabel.parentNode){
                    textLabel.parentNode.insertBefore(container, textLabel);
                    // remove the old textual label node
                    textLabel.parentNode.removeChild(textLabel);
                } else {
                    document.querySelector('.staticrypt-form').appendChild(container);
                }
            } catch(e){
                // ignore transformation errors per-item to avoid breaking the page
                console.error('toggle transform error', e);
            }
        });
    }

    // Run when DOM is ready
    if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', transformToggles);
    } else {
        transformToggles();
    }
})();
</script>
